// Urban Terror 4.3.4 example server config
// Copy to UrbanTerror43/q3ut4/server.cfg and adjust.
// Everything behind // is ignored. Keep values short to avoid "info string length exceeded".

//*** Server Name and Messages ***
set sv_hostname "^7My ^5Urban Terror ^7Server"
set g_motd "Welcome!" // shown while connecting
set sv_joinmessage "^5gl hf" // shown when joining the game

//*** General Game Settings ***
set sv_maxclients "16" // max slots; 16-24 recommended, most maps aren't built for more
set g_maxGameClients "0" // max players actually playing, others spectate. 0 = all
set sv_privateClients "0" // reserved slots for sv_privatePassword
set g_gametype "7" // 0=FFA 1=LMS 3=TDM 4=TS 5=FTL 6=CAH 7=CTF 8=Bomb 9=Jump 10=Freeze Tag 11=Gun Game
set g_instagib "0" // 1 = Instagib mode
sets sv_dlURL "urbanterror.info" // official auto-download redirector; client loads <sv_dlURL>/q3ut4/<map>.pk3

//*** Passwords *** CHANGE THESE
set rconpassword "change-me" // remote admin password
set sv_privatePassword "" // password for private slots
set g_password "" // server password, empty = public
set g_refpass "" // referee password

//*** Referee ***
set g_referee "1"
set g_refNoBan "0"

//*** Limits / Times ***
set timelimit "20" // minutes per map, 0 = never
set fraglimit "0" // 0 = never
set capturelimit "0" // 0 = never
set g_warmup "15" // seconds before the game starts on a new map

//*** Respawning *** (FFA, TDM, CAH, CTF)
set g_respawnDelay "8" // ignored when g_waverespawns is 1
set g_forcerespawn "20" // force respawn after x seconds
set g_waverespawns "1" // whole team respawns together
set g_bluewave "15" // seconds between blue waves
set g_redwave "15" // seconds between red waves
set g_respawnProtection "0" // seconds of spawn protection

//*** Movement ***
set g_stamina "0" // 0 = default, 1 = regain stamina, 2 = infinite stamina
set g_walljumps "3" // max consecutive walljumps (default 3)

//*** Rules ***
set g_deadchat "2" // 0 = alive can't see dead chat, 1 = team only, 2 = all
set g_antiwarp "1" // smooths movement of laggy players
set g_antiwarptol "50" // antiwarp tolerance, default 50
set g_gear "0" // bitmask of DISABLED weapons/items, 0 = everything allowed
set g_allowvote "536870990" // bitmask of allowed votes
set g_failedvotetime "180" // seconds before a new vote after a failed one
set g_followstrict "1" // 1 = dead players can't spectate enemies
set sv_floodprotect "1" // 1 = limits chat spam

//*** Matchmode ***
set g_matchmode "0" // timeouts and ready commands for matches
set g_timeouts "3" // timeouts per team per map
set g_timeoutlength "240" // seconds per timeout
set g_pauselength "0" // rcon pause length, 0 = indefinitely

//*** Team Game Settings ***
set g_friendlyFire "1" // 0 = off, 1 = on with TK kicks, 2 = on without kicks
set g_maxteamkills "3" // TKs before kick when g_friendlyFire is 1
set g_teamkillsforgettime "300" // seconds until TKs are forgotten
set g_teamautojoin "0" // force auto team join on connect
set g_teamForceBalance "1" // block joining the bigger team
set g_maintainTeam "1" // keep teams across map changes
set g_teamnamered "" // empty = Red Dragons
set g_teamnameblue "" // empty = SWAT
set g_swaproles "0" // replay map with swapped teams (useful for Bomb)

//*** Team Survivor / Bomb / FTL ***
set g_maxrounds "0" // 0 = unlimited
set g_RoundTime "2" // minutes per round
set g_survivorrule "0" // 1 = team with more players alive wins on timeout
set g_suddendeath "1" // extra round on tie
set g_bombdefusetime "10" // seconds to defuse
set g_bombexplodetime "40" // seconds until the bomb explodes

//*** Capture the Flag ***
set g_flagreturntime "10" // seconds until a dropped flag returns
set g_hotpotato "1" // minutes until both flags explode when both are taken

//*** Advanced *** only change if you know what you're doing
set sv_pure "1" // block modified pk3 files
set sv_maxRate "0" // max bytes/s per client, 0 = unlimited
set sv_timeout "180" // seconds until a lost client is dropped
set g_inactivity "180" // seconds until an idle player is kicked

//*** Master Servers *** only used with dedicated 2
set sv_master1 "" // set automatically by the engine (master.urbanterror.info)

//*** Other ***
set g_armbands "0" // 0 = player's cg_rgb, 1 = team color, 2 = random
set sv_maxping "0" // 0 = no limit
set sv_minping "0" // 0 = no limit
set g_allowchat "2" // 0 = none, 1 = team only, 2 = all
set g_log "games.log" // written to q3ut4/, empty = no log
set g_logsync "1" // write directly instead of buffered
set g_loghits "0" // log every hit (huge logs)
set g_logroll "0" // rotate logs
set logfile "0" // extra qconsole.log, 1 = buffered, 2 = synced
set g_cahtime "60" // CAH point interval in seconds

//*** Map Rotation ***
set g_mapcycle "mapcycle.txt" // located in q3ut4/
map ut4_turnpike // start map
