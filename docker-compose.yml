services:
  urt:
    build: .
    # or use a prebuilt image:
    # image: ghcr.io/michael-jahn-dev/urbanterror-server:latest
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    volumes:
      - ./UrbanTerror43:/urt
    ports:
      - "27960:27960/udp"
