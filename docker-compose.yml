services:
  urt:
    image: ghcr.io/michael-jahn-dev/urbanterror-server:latest
    # or build the engine yourself:
    # build: .
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    volumes:
      - ./UrbanTerror43:/urt
    ports:
      - "27960:27960/udp"
